<!doctype html>
<html lang="en" data-theme="core">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunzai.</title>
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="256x256" href="/icon-256.png">
<link rel="manifest" href="/app.webmanifest">
<meta name="theme-color" content="#e11d48">
<link rel="stylesheet" href="/tokens.css">
<style>
/* The LOCKED shell (vs-shell-apps, DECISIONS #14): dock of apps | top strip / tabs + canvas |
   status bar. CSS transcribed from the locked artifact, colors swapped to tokens. Apps own their
   canvases; everything here is chrome. Furniture appears only when real state drives it. */
*{box-sizing:border-box}
/* scrollbars are chrome too: thin ink rails everywhere, never the raw platform bar */
*{scrollbar-width:thin;scrollbar-color:var(--scrollbar-thumb) transparent}
html{font-size:100%}
body{margin:0;height:100dvh;overflow:hidden;background:var(--canvas);color:var(--text);
  font-family:var(--font-body);font-size:var(--text-body)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
#shell{height:100dvh;display:grid;grid-template-columns:auto minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;background:var(--canvas)}

/* focus mode: the shared editor-fullscreen (_shared/focus.ts) stamps this on <body>; the shell
   hides its own chrome so the active pane takes the window. Esc exits; never persisted. */
body.focus-editor #tabstrip{display:none}

#topact{display:flex;align-items:center;align-self:center;gap:.5rem;flex:none;padding:0 .4rem}
@container (max-width:30rem){
  #topact{flex-wrap:wrap;max-width:100%;justify-content:flex-end}
  #topact kbd{display:none}
}

/* ───────── MAIN (tabs + canvas) ───────── */
#main{grid-column:2;grid-row:2;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--canvas)}
#tabstrip{display:flex;align-items:stretch;background:var(--chrome);border-bottom:3px solid var(--seam);
  min-height:0;overflow-x:auto;flex:none}
#tabadd{display:none;align-items:center;justify-content:center;flex:none;cursor:pointer;color:var(--text-dim);
  background:var(--shell-panel);border:none;border-right:3px solid var(--seam);padding:0 .8rem;font-size:1.1rem;
  font-family:var(--font-big);font-weight:700;transition:color .1s ease-out}
#tabadd:hover{color:var(--text)}
#tabstrip.hastabs #tabadd{display:flex}
.tabfill{flex:1;background:var(--shell-panel);min-width:1.5rem}
#canvas{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;
  background-image:radial-gradient(var(--tooth) 22%,transparent 24%);background-size:7px 7px}
#canvas>*{flex:1}
/* the between-apps beat while a module loads: quiet mono line, never the previous app's canvas */
#canvasLoading{display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text-dim)}

/* ───────── STATUS BAR ───────── */
#status{background:var(--status-bg);color:var(--status-fg);
  border-top:1px solid color-mix(in srgb,var(--premiere-gold) 30%,transparent);
  display:flex;align-items:center;gap:clamp(.6rem,1.6vw,1.15rem);padding:.36rem clamp(.7rem,1.6vw,1rem);
  font-family:var(--font-ui);font-size:.8125rem;white-space:normal;overflow-wrap:anywhere}
#status .seg{display:flex;align-items:center;gap:.4rem;flex:none}
#status .seg.trim{min-width:0;flex:0 1 auto}
#status .k{color:var(--status-fg);font-weight:600}
#status .note .k::before{content:"";display:inline-block;width:7px;height:7px;margin-right:.5rem;background:var(--premiere-gold);vertical-align:.1em}
#status .b{color:var(--status-fg)}

/* ───────── the follow dialog (shell-owned) ───────── */
.vdialog-overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;padding:1rem}
.vdialog{background:var(--face);color:var(--text);border:3px solid var(--edge);
  box-shadow:6px 6px 0 0 var(--edge);padding:1.1rem 1.3rem;max-width:24rem;width:100%}
.vdialog .msg{margin:0 0 .8rem;font-family:var(--font-big);font-weight:700;font-size:1rem}
.vdialog .remember{display:flex;align-items:center;gap:.5rem;font-family:var(--font-mono);
  font-size:var(--text-control);letter-spacing:.04em;color:var(--text-dim);cursor:pointer;margin-bottom:.9rem}
.vdialog .actions{display:flex;gap:.6rem}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:root[data-reduce-motion] *,:root[data-reduce-motion] *::before,:root[data-reduce-motion] *::after{transition:none!important;animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
/* The crash screen (shell/error-boundary.tsx). Lives here, not in a module, because it must render
   when the React tree is already broken - it cannot depend on anything the app loads. */
.shell-crash{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.9rem;padding:2rem;text-align:center;background:var(--canvas);color:var(--text)}
.shell-crash-title{font-family:var(--font-display,var(--font-body));font-size:1.3rem;margin:0}
.shell-crash-body{max-width:34rem;margin:0;color:var(--muted);line-height:1.5}
.shell-crash-msg{max-width:44rem;overflow:auto;padding:.7rem .9rem;margin:0;text-align:left;
  font-family:var(--font-mono);font-size:var(--text-meta);color:var(--muted);background:var(--seam);
  border:2px solid var(--edge)}
.shell-crash-actions{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}

/* ───────── THE DROP VEIL (shell chrome; DropVeil.tsx) ─────────
   Files dragged anywhere dim the studio behind one loud plate. pointer-events:none so the
   drop itself falls through to the window listener. */
#dropveil{position:fixed;inset:0;z-index:300;pointer-events:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--canvas) 68%,transparent)}
#dropveil .veilbox{border:3px dashed var(--rose);background:var(--chrome);color:var(--text);
  font-family:var(--font-big);font-weight:900;font-size:1.15rem;letter-spacing:.09em;
  text-transform:uppercase;padding:1.2rem 2.2rem;box-shadow:6px 6px 0 0 var(--edge)}

/* ───────── THE RIGHT-CLICK MENU (shell chrome; Menu.tsx) ─────────
   Restored from the locked right-click shell (93d6aa6) after an index rewrite dropped it and the
   menu rendered as naked buttons. */
.vmenu{position:fixed;z-index:200;min-width:11rem;max-width:16rem;background:var(--face);
  border:3px solid var(--edge);box-shadow:5px 5px 0 0 var(--edge);padding:.25rem;
  font-family:var(--font-big)}
.vmenu .hd{font-family:var(--font-mono);font-size:var(--text-meta);letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);padding:.4rem .6rem .35rem;border-bottom:2px solid var(--seam);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmenu .sep{height:2px;background:var(--seam);margin:.25rem .35rem;opacity:.7}
</style>
</head>
<body>
<div id="shell-root"></div>
<!-- ONE React per page: every bundle marks the react family external; the import map resolves
     them all to the single vendor copies (two React instances = null-dispatcher hook crashes) -->
<script type="importmap">
{"imports":{
  "react":"/vendor/react-family.js",
  "react/jsx-runtime":"/vendor/react-family.js",
  "react/jsx-dev-runtime":"/vendor/react-family.js",
  "react-dom/client":"/vendor/react-dom-client.js",
  "react-dom":"/vendor/react-dom-client.js"
}}
</script>
<script type="module" src="/boot.js"></script>
</body>
</html>
