name: release

# Builds and publishes a GitHub Release for one tag. Two doors, same room:
#  - push a tag like v0.1.0 by hand, or
#  - get called by auto-release.yml (workflow_call with the tag it just cut).
# Builds the desktop exe (Windows), the CLI binaries for five targets, Kit for four (the same bake, so
# `bunzai ui` serves the packaged studio anywhere), checksums everything, and publishes with the
# install guide (.github/RELEASE-NOTES-INSTALL.md) at the top of the notes. The tag must match
# package.json's version.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          PKG="v$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          if [ "$PKG" != "$RELEASE_TAG" ]; then
            echo "tag $RELEASE_TAG does not match package.json $PKG" >&2
            exit 1
          fi
      - run: bun run verify:ci

  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The optional remote-access helper, published as its own asset. The app does NOT carry it: users who
      # want the private-mesh link fetch it from this release on request, checked against the hashes
      # committed in src/ui/remote/sidecar-pins.ts. After a release that changes the helper, run
      # `bun scripts/pin-sidecar.ts <tag>` and commit the result.
      - name: Build the remote-access helper
        run: bun sidecar/build.ts --target=windows-x64
      - name: Build Bunzai.exe + Windows CLI + Kit
        run: bun run scripts/build-desktop.ts --cli-targets=bun-windows-x64 --kit
      - name: Install the isolated CDP browser
        run: bunx playwright install chromium
      - name: Produce low-end S21 release evidence against these exact binaries
        shell: pwsh
        run: bun run scale:timed -- --release-evidence --profile low-end --n 10000 --artifact "$env:RUNNER_TEMP\s21-release-evidence.json" --packaged-cli "$PWD\dist\bunzai-cli-windows-x64.exe" --packaged-desktop "$PWD\dist\Bunzai.exe"
      - name: Consume S21 evidence before a release can proceed
        shell: pwsh
        run: bun run scale:release-evidence -- "$env:RUNNER_TEMP\s21-release-evidence.json" --packaged-cli "$PWD\dist\bunzai-cli-windows-x64.exe" --packaged-desktop "$PWD\dist\Bunzai.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: s21-release-evidence
          path: ${{ runner.temp }}\s21-release-evidence.json
          if-no-files-found: error
      - name: Stage the helper as a release asset
        run: Copy-Item sidecar/sidecar-windows-x64.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Bunzai.exe
            dist/bunzai-cli-windows-x64.exe
            dist/bunzai-kit-windows-x64.exe
            dist/sidecar-windows-x64.exe
          if-no-files-found: error

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Both Linux helpers here, arm64 by cross-compile: the helper is pure Go with CGO off, so unlike
      # Kit it does not need a runner of the target architecture.
      - name: Build the remote-access helpers (x64 + arm64)
        run: |
          bun sidecar/build.ts --target=linux-x64
          bun sidecar/build.ts --target=linux-arm64
      - name: Build Linux CLIs (x64 + arm64) + Kit (x64)
        # Kit is x64 only here: this runner is x64 and Kit cannot cross-compile (native opentui).
        # The arm64 Kit is built by build-linux-arm64 below, on a runner of that architecture.
        run: bun run scripts/build-desktop.ts --no-desktop --cli-targets=bun-linux-x64,bun-linux-arm64 --kit
      - name: Stage the helpers as release assets
        run: cp sidecar/sidecar-linux-x64 sidecar/sidecar-linux-arm64 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/bunzai-cli-linux-x64
            dist/bunzai-cli-linux-arm64
            dist/bunzai-kit-linux-x64
            dist/sidecar-linux-x64
            dist/sidecar-linux-arm64
          if-no-files-found: error

  build-linux-arm64:
    needs: verify
    # Kit only. The CLIs for this architecture cross-compile fine on the x64 runner above; Kit
    # cannot, because its terminal renderer is a native library published per platform. The label
    # was confirmed against a real run before being trusted here: an unavailable runner does not
    # fail, it queues forever, which would stall the release rather than break it visibly.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build Kit (arm64)
        run: bun run scripts/build-desktop.ts --no-desktop --kit
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/bunzai-kit-linux-arm64
          if-no-files-found: error

  build-macos:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build the remote-access helpers (arm64 + x64)
        run: |
          bun sidecar/build.ts --target=darwin-arm64
          bun sidecar/build.ts --target=darwin-x64
      - name: Build macOS CLIs (arm64 + x64) + Kit (arm64)
        # Kit is arm64 only here: macos-14 is Apple Silicon and Kit cannot cross-compile.
        run: bun run scripts/build-desktop.ts --no-desktop --cli-targets=bun-darwin-arm64,bun-darwin-x64 --kit
      - name: Stage the helpers as release assets
        run: cp sidecar/sidecar-darwin-arm64 sidecar/sidecar-darwin-x64 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/bunzai-cli-darwin-arm64
            dist/bunzai-cli-darwin-x64
            dist/bunzai-kit-darwin-arm64
            dist/sidecar-darwin-arm64
            dist/sidecar-darwin-x64
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum Bunzai.exe \
            bunzai-cli-windows-x64.exe bunzai-cli-linux-x64 bunzai-cli-linux-arm64 \
            bunzai-cli-darwin-arm64 bunzai-cli-darwin-x64 \
            bunzai-kit-windows-x64.exe bunzai-kit-linux-x64 bunzai-kit-linux-arm64 bunzai-kit-darwin-arm64 \
            sidecar-windows-x64.exe sidecar-linux-x64 sidecar-linux-arm64 \
            sidecar-darwin-arm64 sidecar-darwin-x64 \
            > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes (install guide, changelog link, machine-parseable commit block)
        run: |
          cp .github/RELEASE-NOTES-INSTALL.md notes.md
          PREV="$(git tag --sort=-v:refname | grep -vx "${RELEASE_TAG}" | head -n1 || true)"
          echo "" >> notes.md
          if [ -n "$PREV" ]; then
            echo "**Changes**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${RELEASE_TAG}" >> notes.md
            RANGE="${PREV}..${RELEASE_TAG}"
          else
            echo "**Changes**: https://github.com/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" >> notes.md
            RANGE="${RELEASE_TAG}"
          fi
          # Machine-parseable commit block: Bunzai's in-app version timeline reads EXACTLY this fence.
          # One "<shorthash> <subject>" per commit, newest first; grammar ^[0-9a-f]{7,40} .+$. The app
          # derives each release's headline from the first non-release, non-merge subject; absence of the
          # fence just renders "commit log unavailable" (the parser never guesses from prose).
          echo "" >> notes.md
          echo "## Commits" >> notes.md
          echo '```commits' >> notes.md
          git log --format='%h %s' "$RANGE" | head -n 500 >> notes.md
          echo '```' >> notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Bunzai ${RELEASE_TAG}" \
            --notes-file notes.md \
            dist/Bunzai.exe \
            dist/bunzai-cli-windows-x64.exe \
            dist/bunzai-cli-linux-x64 \
            dist/bunzai-cli-linux-arm64 \
            dist/bunzai-cli-darwin-arm64 \
            dist/bunzai-cli-darwin-x64 \
            dist/bunzai-kit-windows-x64.exe \
            dist/bunzai-kit-linux-x64 \
            dist/bunzai-kit-linux-arm64 \
            dist/bunzai-kit-darwin-arm64 \
            dist/sidecar-windows-x64.exe \
            dist/sidecar-linux-x64 \
            dist/sidecar-linux-arm64 \
            dist/sidecar-darwin-arm64 \
            dist/sidecar-darwin-x64 \
            dist/SHA256SUMS
