<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunzai</title>
<meta name="description" content="Bunzai is a free, open-source desktop app for playing and making AI roleplay characters on your own computer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..800,100&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">

<a class="skip" href="#main" data-skip>Skip to content</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <mask id="bunny-punch" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="40">
      <rect x="0" y="0" width="64" height="40" fill="#fff"/>
      <!-- bunny: two ears and a round head, punched out of the ticket -->
      <ellipse cx="28.5" cy="13" rx="2.6" ry="7" transform="rotate(-12 28.5 13)" fill="#000"/>
      <ellipse cx="35.5" cy="13" rx="2.6" ry="7" transform="rotate(12 35.5 13)" fill="#000"/>
      <circle cx="32" cy="24" r="7.2" fill="#000"/>
      <circle cx="38.6" cy="29.2" r="2.4" fill="#000"/>
    </mask>
  </defs>
</svg>

<header class="site-head">
  <div class="wrap head-row">
    <a class="brand" href="#/" aria-label="Bunzai home">
      <svg class="logo" viewBox="0 0 64 40" aria-hidden="true">
        <path mask="url(#bunny-punch)" fill="currentColor" d="M6 2h52a4 4 0 0 1 4 4v9a5 5 0 0 0 0 10v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4v-9a5 5 0 0 0 0-10V6a4 4 0 0 1 4-4z"/>

    <nav id="site-nav" class="site-nav" aria-label="Main">

      <a href="#/guides" data-nav="guides">Guides</a>
      <a href="#/whats-new" data-nav="whats-new">What's new</a>
      <a href="#/try" data-nav="try">Try it</a>
      <a href="#/download" data-nav="download" class="btn btn-stamp btn-sm">Download</a>
    </nav>

<footer class="site-foot">

      <a class="brand brand-foot" href="#/">
