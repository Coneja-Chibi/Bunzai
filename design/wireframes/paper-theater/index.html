<!doctype html>
<html lang="en" data-theme="stage">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunzai · The paper theater</title>
  <link rel="stylesheet" href="../../../src/ui/theme/tokens.css">
  <link rel="stylesheet" href="theater.css">
  <script src="art.js" defer></script>
  <script src="screens.js" defer></script>
  <script src="features.js" defer></script>
  <script src="gallery.js" defer></script>
</head>
<body>
  <a class="skip" href="#screen">Skip to wireframe</a>
  <header class="review-bar">
    <a href="#title" class="review-brand">Bunzai <span>the paper theater</span></a>
    <div class="review-controls">
      <label>Scene <select id="screen-pick" aria-label="Wireframe screen"></select></label>
      <label>State <select id="state-pick"><option value="ready">Ready</option><option value="empty">Empty</option><option value="loading">Loading</option><option value="error">Error</option></select></label>
      <button id="theme-pick" aria-pressed="false">Daylight comparison</button>
      <button id="width-pick" aria-pressed="false">Phone width</button>
    </div>
  </header>
  <div class="preview-wrap"><div class="app" id="app">
    <header class="masthead"><a href="#home" class="wordmark"><span id="brand-bun"></span>bunzai<span class="edition">a little theater for big stories</span></a><div class="mast-actions"><span class="status">Library open</span><a href="#agent">Ask Kit</a><a href="#gate">Lock</a></div></header>
    <div class="shell"><nav id="dock" aria-label="App rooms"></nav><main id="screen" tabindex="-1"></main></div>
    <footer class="app-foot"><span>Your stories, on your computer.</span><span>Design preview · sample content</span></footer>
  </div></div>
  <aside class="review-note" id="review-note"></aside>
  <div id="feedback" role="status" aria-live="polite"></div>
  <dialog id="preview-dialog"><form method="dialog"><button class="dialog-close" aria-label="Close preview">×</button></form><div id="dialog-content"></div></dialog>
</body>
</html>
