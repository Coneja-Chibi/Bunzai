<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 456" width="780" height="456" role="img" aria-label="defense layers and their honest status"><style>text{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#1a1712}.h{font-size:13px;font-weight:700;letter-spacing:.02em}.n{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.08em}.l{font-size:12.5px;font-weight:650}.s{font-size:11px;fill:#8a8270}.c{font-size:11px;fill:#8a8270}.th{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.04em}</style><rect x="1" y="1" width="778" height="454" rx="10" fill="#faf8f3" stroke="#e6e0d4"/><line x1="20" y1="42" x2="760" y2="42" stroke="#e6e0d4"/><text x="20" y="30" class="n">FIG 02</text><text x="72" y="30" class="h">defense layers and their honest status</text><style>.mc{font-size:12px}.mh{font-size:12px;font-weight:700}</style><rect x="20" y="52" width="740" height="392" rx="6" fill="#ffffff" stroke="#e6e0d4"/><text x="230" y="74" class="mh">Enforced in</text><text x="410" y="74" class="mh">Code-layer suite</text><text x="590" y="74" class="mh">Remaining host checks</text><line x1="20" y1="88" x2="760" y2="88" stroke="#e6e0d4"/><text x="30" y="110" class="l">Parse, not execute</text><text x="230" y="110" class="mc">core adapters + escrow</text><text x="410" y="110" class="mc">Yes</text><text x="590" y="110" class="mc">not applicable</text><line x1="20" y1="124" x2="760" y2="124" stroke="#e6e0d4"/><text x="30" y="146" class="l">Archive caps</text><text x="230" y="146" class="mc">core/archive.ts</text><text x="410" y="146" class="mc">Yes</text><text x="590" y="146" class="mc">not applicable</text><line x1="20" y1="160" x2="760" y2="160" stroke="#e6e0d4"/><text x="30" y="182" class="l">ReDoS gate</text><text x="230" y="182" class="mc">regex/validate.ts</text><text x="410" y="182" class="mc">Yes</text><text x="590" y="182" class="mc">not applicable</text><line x1="20" y1="196" x2="760" y2="196" stroke="#e6e0d4"/><text x="30" y="218" class="l">Sanitized render</text><text x="230" y="218" class="mc">ui/_shared render</text><text x="410" y="218" class="mc">Yes</text><text x="590" y="218" class="mc">not applicable</text><line x1="20" y1="232" x2="760" y2="232" stroke="#e6e0d4"/><text x="30" y="254" class="l">Lua resource budgets</text><text x="230" y="254" class="mc">sandbox/lua limits</text><text x="410" y="254" class="mc">Yes</text><text x="590" y="254" class="mc">not applicable</text><line x1="20" y1="268" x2="760" y2="268" stroke="#e6e0d4"/><text x="30" y="290" class="l">Value-only wire</text><text x="230" y="290" class="mc">sandbox/lua protocol</text><text x="410" y="290" class="mc">Yes</text><text x="590" y="290" class="mc">not applicable</text><line x1="20" y1="304" x2="760" y2="304" stroke="#e6e0d4"/><text x="30" y="326" class="l">Loopback token gate</text><text x="230" y="326" class="mc">ui/server-security</text><text x="410" y="326" class="mc">Yes</text><text x="590" y="326" class="mc">not applicable</text><line x1="20" y1="340" x2="760" y2="340" stroke="#e6e0d4"/><text x="30" y="362" class="l">Distinct-origin</text><text x="30" y="378" class="l">isolation</text><text x="230" y="362" class="mc">dual loopback listener</text><text x="410" y="362" class="mc">HTTP layer only</text><text x="590" y="362" class="mc">packaged WebView</text><text x="590" y="378" class="mc">isolation unmeasured</text><line x1="20" y1="392" x2="760" y2="392" stroke="#e6e0d4"/><text x="30" y="414" class="l">BYOK key vault</text><text x="230" y="414" class="mc">encrypted vault and OS</text><text x="230" y="430" class="mc">backends</text><text x="410" y="414" class="mc">unit / fake OS tools</text><text x="590" y="414" class="mc">native results</text><text x="590" y="430" class="mc">required</text><line x1="220" y1="52" x2="220" y2="444" stroke="#e6e0d4"/></svg>
