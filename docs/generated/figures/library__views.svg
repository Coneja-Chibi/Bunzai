<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 536" width="600" height="536" role="img" aria-label="one browse room, five views"><style>text{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#1a1712}.h{font-size:13px;font-weight:700;letter-spacing:.02em}.n{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.08em}.l{font-size:12.5px;font-weight:650}.s{font-size:11px;fill:#8a8270}.c{font-size:11px;fill:#8a8270}.th{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.04em}</style><rect x="1" y="1" width="598" height="534" rx="10" fill="#faf8f3" stroke="#e6e0d4"/><line x1="20" y1="42" x2="580" y2="42" stroke="#e6e0d4"/><text x="20" y="30" class="n">FIG 01</text><text x="72" y="30" class="h">one browse room, five views</text><style>.mc{font-size:12px}.mh{font-size:12px;font-weight:700}</style><rect x="20" y="52" width="560" height="472" rx="6" fill="#ffffff" stroke="#e6e0d4"/><text x="230" y="74" class="mh">Shows</text><text x="410" y="74" class="mh">Available on</text><line x1="20" y1="88" x2="580" y2="88" stroke="#e6e0d4"/><text x="30" y="110" class="l">Grid</text><text x="230" y="110" class="mc">a fluid wall of</text><text x="230" y="126" class="mc">portrait cards, sized</text><text x="230" y="142" class="mc">by the art slider</text><text x="410" y="110" class="mc">every deck</text><line x1="20" y1="156" x2="580" y2="156" stroke="#e6e0d4"/><text x="30" y="178" class="l">Show</text><text x="230" y="178" class="mc">one piece at a time:</text><text x="230" y="194" class="mc">hero art, its own</text><text x="230" y="210" class="mc">tagline and</text><text x="230" y="226" class="mc">description, a rail to</text><text x="230" y="242" class="mc">jump</text><text x="410" y="178" class="mc">every deck</text><line x1="20" y1="256" x2="580" y2="256" stroke="#e6e0d4"/><text x="30" y="278" class="l">List</text><text x="230" y="278" class="mc">dense rows: thumbnail,</text><text x="230" y="294" class="mc">name, kind, and</text><text x="230" y="310" class="mc">workbench state</text><text x="410" y="278" class="mc">every deck</text><line x1="20" y1="324" x2="580" y2="324" stroke="#e6e0d4"/><text x="30" y="346" class="l">Shelf</text><text x="230" y="346" class="mc">spine cards with a</text><text x="230" y="362" class="mc">name-or-key search</text><text x="230" y="378" class="mc">box; a Lorebook spine</text><text x="230" y="394" class="mc">adds on/off, Split,</text><text x="230" y="410" class="mc">Copy, and</text><text x="230" y="426" class="mc">drag-to-merge</text><text x="410" y="346" class="mc">every deck</text><line x1="20" y1="440" x2="580" y2="440" stroke="#e6e0d4"/><text x="30" y="462" class="l">Sets</text><text x="230" y="462" class="mc">spine cards with a</text><text x="230" y="478" class="mc">rule count, a computed</text><text x="230" y="494" class="mc">one-line description,</text><text x="230" y="510" class="mc">and a slow-rule flag</text><text x="410" y="462" class="mc">Regex sets only</text><line x1="220" y1="52" x2="220" y2="524" stroke="#e6e0d4"/></svg>
