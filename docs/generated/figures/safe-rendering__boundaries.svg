<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 548" width="600" height="548" role="img" aria-label="two surfaces, enforced where, proven where"><style>text{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#1a1712}.h{font-size:13px;font-weight:700;letter-spacing:.02em}.n{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.08em}.l{font-size:12.5px;font-weight:650}.s{font-size:11px;fill:#8a8270}.c{font-size:11px;fill:#8a8270}.th{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.04em}</style><rect x="1" y="1" width="598" height="546" rx="10" fill="#faf8f3" stroke="#e6e0d4"/><line x1="20" y1="42" x2="580" y2="42" stroke="#e6e0d4"/><text x="20" y="30" class="n">FIG 01</text><text x="72" y="30" class="h">two surfaces, enforced where, proven where</text><style>.mc{font-size:12px}.mh{font-size:12px;font-weight:700}</style><rect x="20" y="52" width="560" height="484" rx="6" fill="#ffffff" stroke="#e6e0d4"/><text x="230" y="74" class="mh">Enforced by</text><text x="410" y="74" class="mh">Proven where</text><line x1="20" y1="88" x2="580" y2="88" stroke="#e6e0d4"/><text x="30" y="110" class="l">Prose fields</text><text x="30" y="126" class="l">(description, greeting,</text><text x="30" y="142" class="l">notes)</text><text x="230" y="110" class="mc">DOMPurify</text><text x="230" y="126" class="mc">tag/attribute strip +</text><text x="230" y="142" class="mc">ambient app CSP</text><text x="230" y="158" class="mc">(script-src self, no</text><text x="230" y="174" class="mc">unsafe-inline;</text><text x="230" y="190" class="mc">connect-src self)</text><text x="410" y="110" class="mc">jsdom DOM assertions</text><text x="410" y="126" class="mc">(render-markup.test.ts</text><text x="410" y="142" class="mc">) + HTTP header</text><text x="410" y="158" class="mc">assertion</text><text x="410" y="174" class="mc">(server.test.ts)</text><line x1="20" y1="204" x2="580" y2="204" stroke="#e6e0d4"/><text x="30" y="226" class="l">Backdrop HTML</text><text x="30" y="242" class="l">(behavior.backgroundHTML</text><text x="30" y="258" class="l">)</text><text x="230" y="226" class="mc">DOMPurify</text><text x="230" y="242" class="mc">tag/attribute strip +</text><text x="230" y="258" class="mc">sandboxed srcdoc</text><text x="230" y="274" class="mc">iframe (sandbox empty,</text><text x="230" y="290" class="mc">no allow-same-origin)</text><text x="230" y="306" class="mc">+ scoped CSP</text><text x="410" y="226" class="mc">jsdom DOM + srcdoc</text><text x="410" y="242" class="mc">string assertions</text><text x="410" y="258" class="mc">(sealed-html-preview.t</text><text x="410" y="274" class="mc">est.ts)</text><line x1="20" y1="320" x2="580" y2="320" stroke="#e6e0d4"/><text x="30" y="342" class="l">Backdrop CSS</text><text x="30" y="358" class="l">(behavior.backgroundCSS)</text><text x="230" y="342" class="mc">Regex strip (import,</text><text x="230" y="358" class="mc">remote url(),</text><text x="230" y="374" class="mc">font-face, expression,</text><text x="230" y="390" class="mc">close-style breakout)</text><text x="230" y="406" class="mc">+ the same scoped CSP</text><text x="410" y="342" class="mc">Unit tests on regex</text><text x="410" y="358" class="mc">output only; not a CSS</text><text x="410" y="374" class="mc">parser by the module's</text><text x="410" y="390" class="mc">own comment</text><line x1="20" y1="420" x2="580" y2="420" stroke="#e6e0d4"/><text x="30" y="442" class="l">Packaged WebView2 host</text><text x="230" y="442" class="mc">Same sandboxed-iframe</text><text x="230" y="458" class="mc">and CSP code path</text><text x="230" y="474" class="mc">ships as-is, no</text><text x="230" y="490" class="mc">packaged-specific</text><text x="230" y="506" class="mc">handling</text><text x="410" y="442" class="mc">Not measured for this</text><text x="410" y="458" class="mc">component; ADR-009</text><text x="410" y="474" class="mc">records the analogous</text><text x="410" y="490" class="mc">gap for the Lua-worker</text><text x="410" y="506" class="mc">origin boundary, Plan</text><text x="410" y="522" class="mc">017 BLOCKED</text><line x1="220" y1="52" x2="220" y2="536" stroke="#e6e0d4"/></svg>
